services:
  - type: web
    name: binge-lingo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Scene Talk sessions are process-local in the current MVP, so one worker
    # keeps every request for a conversation in the same process.
    startCommand: gunicorn review:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: API_MODEL
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      # Password for the login gate. Change it in the Render dashboard.
      - key: APP_PASSWORD
        sync: false
      # Signs the login session cookie. generateValue makes Render mint a stable
      # random secret so logins persist across deploys and restarts.
      - key: SECRET_KEY
        generateValue: true
      # Leave HTTPS_PROXY unset on Render — the server reaches Notion directly.
      - key: HTTPS_PROXY
        value: ""
