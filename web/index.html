<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BingeLingo · 复习</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">BingeLingo</span>
      <span class="brand-sub">复习</span>
    </div>
    <div class="layer-pips" id="layer-pips" aria-hidden="true">
      <span class="pip" data-layer="1"></span>
      <span class="pip" data-layer="2"></span>
      <span class="pip" data-layer="3"></span>
    </div>
  </header>

  <main class="stage">
    <div id="notice" class="notice" hidden></div>

    <section id="card" class="card" hidden>
      <div class="body">
        <div class="difficulty" id="difficulty"></div>

        <!-- layer banner: tells the learner where they are -->
        <div class="layer-banner" id="layer-banner"></div>

        <!-- the challenge sentence / prompt -->
        <div class="prompt" id="prompt"></div>

        <!-- layer 2 hints -->
        <div class="hints" id="hints" hidden>
          <div class="hint-row"><span class="hint-tag">含义</span><span id="hint-meaning"></span></div>
          <div class="hint-row"><span class="hint-tag">首字母</span><span class="hint-initials" id="hint-initials"></span></div>
        </div>

        <!-- typed answer -->
        <div class="guess" id="guess" hidden>
          <input
            id="guess-input"
            class="guess-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="打出你猜的答案，回车提交"
          />
          <button id="guess-submit" class="guess-submit">提交</button>
        </div>

        <!-- verdict after a submission -->
        <div class="verdict" id="verdict" hidden></div>

        <!-- full answer reveal (layer 3 / correct) -->
        <div class="answer" id="answer" hidden>
          <figure class="shot" id="shot" hidden>
            <img id="shot-img" alt="剧照" />
          </figure>
          <div class="answer-expression" id="a-expression"></div>
          <div class="answer-line" id="a-line"></div>
          <div class="answer-cn" id="a-chinese"></div>
          <div class="answer-context" id="a-context"></div>
          <div class="answer-structure" id="a-structure"></div>
        </div>

        <button id="reveal" class="reveal">直接揭晓 <span class="hint">Space</span></button>
      </div>
    </section>
  </main>

  <footer class="nav" id="nav" hidden>
    <button id="prev" class="nav-btn">← 上一张</button>
    <span id="counter" class="counter">0 / 0</span>
    <button id="next" class="nav-btn">下一张 →</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
