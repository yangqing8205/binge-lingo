<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BingeLingo · Episode Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- faint film-perforation strips down each edge (decoration) -->
  <div class="perf perf-left" aria-hidden="true"></div>
  <div class="perf perf-right" aria-hidden="true"></div>

  <div class="wrap">
    <!-- ===== episode archive header ===== -->
    <header class="archive-head">
      <div class="head-top">
        <div class="brand">
          <span class="brand-mark">BingeLingo</span>
          <span class="brand-sub">MY EPISODE FILES</span>
        </div>
        <div class="head-meta">
          <span class="counter" id="counter">– / –</span>
          <span class="streak" id="streak">DAY 1</span>
        </div>
      </div>
      <div class="episode-line" id="episode-line"></div>
      <nav class="modes" id="modes">
        <button class="mode-tab is-active" data-mode="review">复习档案</button>
        <button class="mode-tab" data-mode="chat">对话练习</button>
      </nav>
    </header>

    <main class="stage">
      <div id="notice" class="notice" hidden></div>

      <!-- =================== REVIEW VIEW =================== -->
      <div id="review-view">
      <!-- ===== the file card ===== -->
      <section id="card" class="filecard" hidden>
        <span class="filetab" id="filetab">TRANSFER TEST</span>
        <span class="difficulty" id="difficulty"></span>

        <div class="filebody">
          <!-- LAYER 1/2 prompt: the new-context mini-scenario -->
          <div class="prompt" id="prompt"></div>

          <!-- LAYER 2 hint block -->
          <div class="hintblock" id="hintblock" hidden>
            <span class="hint-label">HINT</span>
            <div class="hint-row">
              <span class="hint-key">语义</span>
              <span id="hint-meaning"></span>
            </div>
            <div class="hint-row">
              <span class="hint-key">首字母</span>
              <span class="hint-initials" id="hint-initials"></span>
            </div>
          </div>

          <!-- gentle wrong-answer nudge -->
          <div class="nudge" id="nudge" hidden></div>

          <!-- answer input -->
          <div class="answerbar" id="answerbar">
            <input
              id="guess-input"
              class="guess-input"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Type your answer..."
            />
            <button id="guess-submit" class="btn-submit">提交</button>
          </div>
          <button id="skip" class="skip">跳过（直接看答案）</button>

          <!-- stamp feedback -->
          <div class="stamp-slot" id="stamp-slot" hidden>
            <div class="stamp" id="stamp"></div>
            <div class="stamp-note" id="stamp-note"></div>
          </div>

          <!-- LAYER 3 reveal: original evidence -->
          <div class="evidence" id="evidence" hidden>
            <div class="evidence-head">ORIGINAL EVIDENCE</div>

            <figure class="photo" id="photo" hidden>
              <span class="tape" aria-hidden="true"></span>
              <img id="shot-img" alt="剧照" />
              <figcaption id="photo-caption"></figcaption>
            </figure>

            <div class="ev-grid">
              <div class="ev-line" id="ev-line"></div>
              <div class="ev-answer" id="ev-answer"></div>
              <div class="ev-cn" id="ev-cn"></div>
              <div class="ev-context" id="ev-context"></div>
              <div class="ev-structure" id="ev-structure"></div>
            </div>
            <div class="ev-foot">You saved this expression from this scene.</div>
          </div>
        </div>
      </section>

      <!-- ===== review nav ===== -->
      <footer class="nav" id="nav" hidden>
        <button id="prev" class="nav-btn">← 上一张</button>
        <div class="pips" id="pips" aria-hidden="true">
          <span class="pip" data-layer="1"></span>
          <span class="pip" data-layer="2"></span>
          <span class="pip" data-layer="3"></span>
        </div>
        <button id="next" class="nav-btn">下一张 →</button>
      </footer>
      </div><!-- /review-view -->

      <!-- =================== CHAT VIEW =================== -->
      <div id="chat-view" hidden>

        <!-- character picker -->
        <section id="char-select" class="char-select">
          <div class="char-select-head">选一个角色，开始口语陪练</div>
          <div class="char-grid" id="char-grid"></div>
        </section>

        <!-- chat room -->
        <section id="chat-room" class="chat-room" hidden>
          <header class="chat-head">
            <div class="chat-who">
              <span class="chat-avatar" id="chat-avatar"></span>
              <span class="chat-name" id="chat-name"></span>
              <span class="online-dot" title="online"></span>
            </div>
            <button class="chat-back" id="chat-back">← 换角色</button>
          </header>

          <button class="targets-toggle" id="targets-toggle">
            今日目标表达 <span id="targets-count"></span> ▾
          </button>
          <div class="targets-list" id="targets-list" hidden></div>

          <div class="chat-log" id="chat-log"></div>

          <div class="chat-inputbar" id="chat-inputbar">
            <input
              id="chat-input"
              class="chat-input"
              type="text"
              autocomplete="off"
              placeholder="用英语回复…"
            />
            <button id="chat-send" class="btn-submit">发送</button>
          </div>
          <button id="chat-end" class="chat-end">结束对话，看点评</button>

          <!-- critique stamp card -->
          <div class="critique" id="critique" hidden>
            <div class="stamp-slot">
              <div class="stamp gold" id="critique-stamp"></div>
            </div>
            <div class="critique-body" id="critique-body"></div>
            <button id="critique-again" class="nav-btn">再练一次</button>
          </div>
        </section>
      </div><!-- /chat-view -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
