<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BingeLingo · Practice to Go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand-mark">BingeLingo</span>
        <span class="brand-sub">The Archive</span>
      </div>
      <div class="topbar__meta">
        <span class="streak" id="streak">DAY 1</span>
      </div>
    </div>
  </header>

  <div class="desk">
    <div class="folder">
      <div class="folder__dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="folder__body">
        <div class="case-head">
          <div>
            <span class="case-kicker">Take It Anywhere</span>
            <h1 class="case-title">Practice to Go</h1>
          </div>
        </div>

        <main>
          <div class="export-intro">
            <p class="export-sub">
              把下面生成的提示词复制到任何 AI 对话工具（ChatGPT / 豆包 / Kimi / Claude），
              就能开始角色扮演口语练习。选好角色和选项，我们帮你生成定制的练习指令。
            </p>
          </div>

          <div id="notice" class="notice" hidden></div>

          <div class="export-grid">
            <div class="options">
              <div class="opt-group">
                <div class="opt-label">1 · 选择角色</div>
                <div class="opt-choices" id="opt-character"></div>
              </div>

              <div class="opt-group">
                <div class="opt-label">
                  2 · 选择要练的表达
                  <button class="opt-mini" id="expr-all">全选</button>
                  <button class="opt-mini" id="expr-none">清空</button>
                </div>
                <div class="opt-tags" id="opt-expressions"></div>
              </div>

              <div class="opt-group">
                <div class="opt-label">3 · 对话轮数</div>
                <div class="opt-choices" id="opt-turns"></div>
              </div>

              <div class="opt-group">
                <div class="opt-label">4 · 引导强度</div>
                <div class="opt-choices" id="opt-guidance"></div>
              </div>

              <div class="opt-group">
                <div class="opt-label">5 · 场景设定</div>
                <div class="opt-choices" id="opt-scene"></div>
                <input id="scene-custom" class="opt-input" type="text" placeholder="描述你想要的场景…" hidden />
              </div>

              <div class="opt-group">
                <div class="opt-label">6 · 纠错方式</div>
                <div class="opt-choices" id="opt-correction"></div>
              </div>

              <div class="opt-group">
                <div class="opt-label">7 · AI 回复语言</div>
                <div class="opt-choices" id="opt-language"></div>
              </div>
            </div>

            <div class="result">
              <div class="result-head">
                <span class="result-title">Your Prompt</span>
                <button id="copy-btn" class="btn-submit">复制</button>
              </div>
              <textarea id="prompt-out" class="prompt-out" readonly spellcheck="false"></textarea>
              <div class="result-foot" id="copy-note"></div>
            </div>
          </div>
        </main>
      </div>

      <nav class="folder-tabs">
        <a class="folder-tab" href="/review"><span>复习做题</span></a>
        <a class="folder-tab" href="/chat"><span>对话练习</span></a>
        <a class="folder-tab" href="/export"><span>Practice to Go</span></a>
      </nav>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="export.js"></script>
</body>
</html>
